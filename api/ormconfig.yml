default:
  type: 'postgres'
  host: 'localhost'
  port: 5432
  username: 'postgres'
  password: ''
  database: 'thecfapp'
  synchronize: true
  logging: true
  entities: # Wants both ts and js files!
    - 'build/core/**/entity.js'
    - 'src/core/**/entity.ts'
  seeds:
    - 'src/db-seeder.ts'
    - 'build/db-seeder.js'
  factories:
    - 'src/core/**/entity.factory.ts'
    - 'build/core/**/entity.factory.js'
