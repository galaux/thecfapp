overwrite: true
schema:
  - 'src/schema.graphql'
  - 'src/**/*.graphql'
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
      mappers:
        Community: ~core/community/entity#Community
        Score: ~core/score/entity#Score
        User: ~core/user/entity#User
        Wod: ~core/wod/entity#Wod
        Workout: ~core/workout/entity#Workout
      mapperTypeSuffix: Entity
  ./graphql.schema.json:
    plugins:
      - 'introspection'
