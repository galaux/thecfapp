overwrite: true
schema:
  - 'src/schema.graphql'
  - 'src/**/*.graphql'
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
      mappers:
        UserRecord: ../core/user-record/entities/user-record#ORMUserRecord
        UserRecordType: ../core/user-record/entities/user-record-type#ORMUserRecordType
  ./graphql.schema.json:
    plugins:
      - 'introspection'
