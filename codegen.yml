overwrite: true
schema:
  - 'src/schema.graphql'
  - 'src/**/*.graphql'
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
      mappers:
        PersonalRecord: ../core/personal-record/entities/personal-record#ORMPersonalRecord
        PersonalRecordType: ../core/personal-record/entities/personal-record-type#ORMPersonalRecordType
  ./graphql.schema.json:
    plugins:
      - 'introspection'
