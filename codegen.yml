overwrite: true
schema:
  - 'src/schema.graphql'
  - 'src/**/*.graphql'
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
  ./graphql.schema.json:
    plugins:
      - 'introspection'
