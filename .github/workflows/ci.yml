name: CI

on: [push]

jobs:

  build-views:
    name: Build Views
    runs-on: ubuntu-18.04
    strategy:
      matrix:
        node-version: ["14"]

    steps:
      - uses: actions/checkout@v2

      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn --cwd views install

      - name: Check lint
        run: yarn --cwd views lint:check

      # - name: Test
      #   run: yarn --cwd views test

      - name: Build
        run: yarn --cwd views build

  build-mobile:
    name: Build Mobile
    runs-on: ubuntu-18.04

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: yarn install

      # - name: Test
      #   run: yarn test

      - name: Build
        run: yarn build

  build-api:
    name: Build API
    runs-on: ubuntu-18.04

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Prepare java
        uses: actions/setup-java@v1
        with:
          # Should be kept in sync with ../system.properties
          java-version: 11

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@3.3
        with:
          # Should be kept in sync with ../app.json
          cli: 1.10.3.933

      - name: Setup Maven
        uses: s4u/maven-settings-action@v2.4.0
        with:
          servers: |
            [
              {
                "id": "my.datomic.com",
                "username": "${env.MY_DATOMIC_REPO_USERNAME}",
                "password": "${env.MY_DATOMIC_REPO_PASSWORD}"
              },
              {
                "id": "cognitect-dev-tools",
                "username": "${env.COGNITECT_DEVTOOLS_REPO_USERNAME}",
                "password": "${env.COGNITECT_DEVTOOLS_REPO_PASSWORD}"
              }
            ]

      # - name: Run tests
      #   env:
      #     MY_DATOMIC_REPO_USERNAME: ${{ secrets.MY_DATOMIC_REPO_USERNAME }}
      #     MY_DATOMIC_REPO_PASSWORD: ${{ secrets.MY_DATOMIC_REPO_PASSWORD }}
      #     COGNITECT_DEVTOOLS_REPO_USERNAME: ${{ secrets.COGNITECT_DEVTOOLS_REPO_USERNAME }}
      #     COGNITECT_DEVTOOLS_REPO_PASSWORD: ${{ secrets.COGNITECT_DEVTOOLS_REPO_PASSWORD }}
      #   run: clojure -M:env/test:test
      #   shell: bash

      - name: Build
        env:
          MY_DATOMIC_REPO_USERNAME: ${{ secrets.MY_DATOMIC_REPO_USERNAME }}
          MY_DATOMIC_REPO_PASSWORD: ${{ secrets.MY_DATOMIC_REPO_PASSWORD }}
          COGNITECT_DEVTOOLS_REPO_USERNAME: ${{ secrets.COGNITECT_DEVTOOLS_REPO_USERNAME }}
          COGNITECT_DEVTOOLS_REPO_PASSWORD: ${{ secrets.COGNITECT_DEVTOOLS_REPO_PASSWORD }}
        run: clojure -T:build uber
        shell: bash
