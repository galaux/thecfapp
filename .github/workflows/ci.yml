name: CI

on: [push]

jobs:
  build:
    name: Build
    runs-on: ubuntu-18.04
    strategy:
      matrix:
        node-version: ["14"]

    steps:
      - uses: actions/checkout@v2

      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: |
          yarn install

      - name: Eslint/Prettier
        run: |
          yarn workspace @thecfapp/front format:check
          yarn lint

      - name: Build & Test
        run: |
          yarn build
          yarn test
