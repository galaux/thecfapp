"Input to create a `Wod`"
input CreateWodInput {
  date: Date!
  workoutId: ID!
}

extend type Mutation {
  """
  Create a Workout Of the Day record.
  """
  createWod(input: CreateWodInput!): Wod!
}

extend type Query {
  """
  Workouts of the Day of the communities the user belongs to.

  TODO Ultimately this should also return the WoDs the user has participated to
  (DB schema link User-Score)
  """
  userWods(userId: ID!): [Wod!]!

  """
  Get a Workout Of the Day by its id.
  """
  wod(id: ID!): Wod!
}

"Record of a Workout Of the Day"
type Wod {
  id: ID!
  community: Community!
  date: Date!
  scores(userId: ID!): [Score!]!
  workout: Workout!
}
