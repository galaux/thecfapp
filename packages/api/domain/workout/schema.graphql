"Input to create a `Workout`"
input CreateWorkoutInput {
  description: String!
  name: String!
}

extend type Mutation {
  """
  Create a Workout record.
  """
  createWorkout(input: CreateWorkoutInput!): Workout!
}

extend type Query {
  """
  List of Workouts.
  """
  workouts: [Workout!]!
}

"Record of a Workout"
type Workout {
  id: ID!
  description: String!
  name: String!
}
