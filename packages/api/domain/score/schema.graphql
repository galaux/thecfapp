"Input to record the score of a `User` to a `Wod` with a score"
input CreateScore {
  userId: ID!
  value: Int!
  wodId: ID!
}

"Record of the score of a `User` to a `Wod` with a score"
type Score {
  id: ID!
  user: User!
  value: Int!
  wod: Wod!
}

extend type Mutation {
  """
  Record a `User` taking part to a `Wod` with a score.
  """
  createScore(input: CreateScore!): [Wod!]!
}

extend type Query {
  """
  List of scores of `User`s to `Wod`s.
  """
  scores: [Score!]!
}
