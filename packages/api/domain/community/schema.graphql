"Input to a `Community` record"
input CreateCommunityInput {
  city: String
  country: String
  name: String!
  street: String
  zipCode: String
}

"Record of an address"
type Address {
  city: String
  country: String
  street: String
  zipCode: String
}

"Record of a community"
type Community {
  id: ID!
  address: Address
  name: String!
  wods: [Wod!]!
}

extend type Mutation {
  """
  Create a community.
  """
  createCommunity(input: CreateCommunityInput!): Community!
}

extend type Query {
  """
  List all communities.
  """
  communities: [Community!]!

  """
  List all communities a user belongs to.
  """
  userCommunities(userId: ID!): [Community!]!
}
