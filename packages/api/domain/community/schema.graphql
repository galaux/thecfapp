"Input to a `Community` record"
input NewCommunityInput {
  city: String
  country: String
  name: String!
  street: String
  zipCode: String
}

"Record of an address"
type Address {
  city: String
  country: String
  street: String
  zipCode: String
}

"Record of a community"
type Community {
  id: ID!
  address: Address
  memberCount: Int!
  name: String!
  wods: [Wod!]!
}

extend type Mutation {
  """
  Create a community and add its creator as a member.
  """
  createCommunity(creatorId: ID!, input: NewCommunityInput!): Community!
}

extend type Query {
  """
  List all communities.
  """
  communities: [Community!]!

  """
  Return communities which name matches.
  """
  lookupCommunities(name: String!): [Community!]!

  """
  List all communities a user belongs to.
  """
  userCommunities(userId: ID!): [Community!]!
}
