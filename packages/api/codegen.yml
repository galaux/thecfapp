overwrite: true
schema:
  - '*.graphql'
  - '**/*.graphql'
documents: null
generates:
  generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
      mappers:
        Community: ../domain/community/entity#Community
        Score: ../domain/score/entity#Score
        User: ../domain/user/entity#User
        Wod: ../domain/wod/entity#Wod
        Workout: ../domain/workout/entity#Workout
      mapperTypeSuffix: Entity
  ./graphql.schema.json:
    plugins:
      - 'introspection'
