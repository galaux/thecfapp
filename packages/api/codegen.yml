overwrite: true
schema:
  - '*.graphql'
  - '**/*.graphql'
generates:
  ../mobile/src/types/graphql.ts:
    plugins:
      - typescript
  src/:
    documents: '../mobile/src/**/*.graphql'
    preset: near-operation-file
    presetConfig:
      extension: .generated.tsx
      baseTypesPath: '../../mobile/src/types/graphql'
    plugins:
      - typescript-operations
      - typescript-react-apollo
  generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      contextType: ../types#Context
      useIndexSignature: true
      mappers:
        Address: ../domain/community/entity#Community
        Community: ../domain/community/entity#Community
        Score: ../domain/score/entity#Score
        User: ../domain/user/entity#User
        Wod: ../domain/wod/entity#Wod
        Workout: ../domain/workout/entity#Workout
      mapperTypeSuffix: Entity
  ./graphql.schema.json:
    plugins:
      - 'introspection'
