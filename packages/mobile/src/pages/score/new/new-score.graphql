fragment WodInput on Wod {
  ...WodFields
  scores(userId: $userId) {
    ...ScoreFields
  }
  workout {
    ...WorkoutFields
  }
}

fragment NewScore on Score {
  ...ScoreFields
  # user {
  #   ...UserFields
  # }
  # wod {
  #   ...WodFields
  # }
}

mutation CreateScore($userId: ID!, $wodId: ID!, $value: Int!) {
  createScore(input: { value: $value, userId: $userId, wodId: $wodId }) {
    ...NewScore
  }
}
