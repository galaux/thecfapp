fragment WodForGetCommunityDetail on Wod {
  ...WodFields
  scores {
    ...ScoreFields
    ...ScoreWithBelongsToLoggedUserFields
  }
  workout {
    ...WorkoutFields
  }
}

fragment CommunityForGetCommunity on Community {
  ...CommunityFields
  memberCount
  address {
    ...CommunityAddressFields
  }
  wods {
    ...WodForGetCommunityDetail
  }
}

query GetCommunity($communityId: ID!) {
  community(id: $communityId) {
    ...CommunityForGetCommunity
  }
}
