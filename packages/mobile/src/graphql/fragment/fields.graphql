fragment CommunityAddressFields on Address {
  city
  country
  street
  zipCode
}

fragment CommunityFields on Community {
  id
  name
}

fragment ScoreFields on Score {
  id
  value
}

# Fragment of Score fields required to access @client field belongsToLoggedUser
fragment ScoreWithBelongsToLoggedUserFields on Score {
  belongsToLoggedUser @client
  user {
    id
  }
}

fragment UserFields on User {
  id
  name
}

fragment WodFields on Wod {
  id
  date
}

fragment WorkoutFields on Workout {
  id
  name
  description
  scoringType
}
