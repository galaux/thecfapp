fragment CommunityForFindCommunity on Community {
  ...CommunityFields
  address {
    ...CommunityAddressFields
  }
}

query UserCommunities($userId: ID!) {
  userCommunities(userId: $userId) {
    ...CommunityForFindCommunity
  }
}

fragment CommunityForLookupCommunities on Community {
  ...CommunityForFindCommunity
  isMember @client
  memberCount
}

query LookupCommunities($name: String!) {
  lookupCommunities(name: $name) {
    ...CommunityForLookupCommunities
  }
}

mutation JoinCommunity($userId: ID!, $communityId: ID!) {
  addUserToCommunity(input: { userId: $userId, communityId: $communityId }) {
    ...CommunityForFindCommunity
  }
}

mutation LeaveCommunity($userId: ID!, $communityId: ID!) {
  removeUserFromCommunity(input: { userId: $userId, communityId: $communityId })
}
